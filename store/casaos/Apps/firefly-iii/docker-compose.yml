name: firefly-iii
services:
  firefly-iii:
    image: yunixintel/firefly-iii:24.10-la5
    ports:
    - target: 8080
      published: '18122'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/storage
      target: /var/www/html/storage
    environment:
      TZ: $TZ
      APP_URL: http://localhost:18122
    restart: unless-stopped
    container_name: firefly-iii
x-casaos:
  architectures:
  - loong64
  main: firefly-iii
  author: loong64-port
  category: Productivity
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v6.7.9；PHP 8.5 自编（上游要求 ≥8.5）+ nginx；SQLite 自动迁移/种子；8080'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v6.7.9；PHP 8.5 自编（上游要求 ≥8.5）+ nginx；SQLite 自动迁移/种子；8080'
  developer: Firefly III
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/firefly-iii.png
  tagline:
    zh_cn: Firefly III 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Firefly III LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Firefly III
    en_us: Firefly III
  index: /
  port_map: '18122'
