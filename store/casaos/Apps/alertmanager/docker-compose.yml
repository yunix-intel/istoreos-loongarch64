name: alertmanager
services:
  alertmanager:
    image: yunixintel/alertmanager:24.10-la5
    ports:
    - target: 9093
      published: '18102'
      protocol: tcp
    - target: 9094
      published: '19110'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /alertmanager
    environment:
      TZ: $TZ
    restart: unless-stopped
    container_name: alertmanager
    configs:
    - source: alertmanager.yml
      target: /etc/alertmanager/alertmanager.yml
x-casaos:
  architectures:
  - loong64
  main: alertmanager
  author: loong64-port
  category: Monitoring
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：alertmanager.yml 以 compose configs 内嵌；自定义需修改 configs.content。

      镜像说明：0.34.1；Elm + Vite 前端在 x86 WSL2 构建后 `go:embed`；Go 静态编；openEuler + curl 健康检查；9093 Web / 9094 gossip；以 nobody 运行；默认配置只收不发，生产需挂载自己的
      alertmanager.yml'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: alertmanager.yml is embedded via compose configs; edit configs.content to customize.

      Image notes: 0.34.1；Elm + Vite 前端在 x86 WSL2 构建后 `go:embed`；Go 静态编；openEuler + curl 健康检查；9093 Web / 9094 gossip；以 nobody
      运行；默认配置只收不发，生产需挂载自己的 alertmanager.yml'
  developer: Prometheus
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/prometheus.png
  tagline:
    zh_cn: Alertmanager 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Alertmanager LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Alertmanager
    en_us: Alertmanager
  index: /
  port_map: '18102'
configs:
  alertmanager.yml:
    content: "route:\n  receiver: default\ngroup_by: [alertname]\nreceivers:\n  - name: default\n"
