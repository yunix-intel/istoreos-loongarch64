name: jackett
services:
  jackett:
    image: yunixintel/jackett:24.10-la5
    container_name: jackett
    ports:
    - target: 9117
      published: '18136'
      protocol: tcp
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/downloads
      target: /downloads
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: jackett
  author: loong64-port
  category: Downloaders
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v0.24.2867；.NET 9 源码编，自带运行时；需宿主 libstdc++ 6.0.33（已内置）'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v0.24.2867；.NET 9 源码编，自带运行时；需宿主 libstdc++ 6.0.33（已内置）'
  developer: Jackett
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/jackett.png
  tagline:
    zh_cn: Jackett 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Jackett LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Jackett
    en_us: Jackett
  index: /
  port_map: '18136'
