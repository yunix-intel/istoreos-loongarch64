services:
  karakeep:
    # private-only single image: LBrowser + CDP proxy + app in one container.
    image: local/karakeep-private:0.34.1-p1
    ports: ["3000:3000"]
    shm_size: "1g"
    environment:
      NEXTAUTH_URL: http://<host>:3000
      NEXTAUTH_SECRET: <openssl rand -base64 32>
      CRAWLER_STORE_PDF: "true"
    volumes:
      - ./data:/data
