name: wallabag
services:
  wallabag:
    image: yunixintel/wallabag:24.10-la5
    container_name: wallabag
    ports:
    - target: 80
      published: '18191'
      protocol: tcp
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /var/www/wallabag/data
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: wallabag
  author: loong64-port
  category: Productivity
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：2.6.14；PHP 8.3 + nginx/php-fpm；2.6 起无网页安装向导，entrypoint 首次启动 CLI 安装（默认 wallabag/wallabag）'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 2.6.14；PHP 8.3 + nginx/php-fpm；2.6 起无网页安装向导，entrypoint 首次启动 CLI 安装（默认 wallabag/wallabag）'
  developer: Wallabag
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/wallabag.png
  tagline:
    zh_cn: Wallabag 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Wallabag LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Wallabag
    en_us: Wallabag
  index: /
  port_map: '18191'
