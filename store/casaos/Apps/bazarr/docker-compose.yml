name: bazarr
services:
  bazarr:
    image: yunixintel/bazarr:24.10-la5
    ports:
    - target: 6767
      published: '18108'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/movies
      target: /movies
    - type: bind
      source: /DATA/AppData/$AppID/tv
      target: /tv
    environment:
      TZ: $TZ
    restart: unless-stopped
    container_name: bazarr
x-casaos:
  architectures:
  - loong64
  main: bazarr
  author: loong64-port
  category: Downloaders
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：1.6.2；Python 3.11 + lxml/Pillow 源码编；webrtcvad 补 loongarch 分支；含 ffmpeg/7za；6767'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 1.6.2；Python 3.11 + lxml/Pillow 源码编；webrtcvad 补 loongarch 分支；含 ffmpeg/7za；6767'
  developer: Bazarr
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/bazarr.png
  tagline:
    zh_cn: Bazarr 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Bazarr LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Bazarr
    en_us: Bazarr
  index: /
  port_map: '18108'
