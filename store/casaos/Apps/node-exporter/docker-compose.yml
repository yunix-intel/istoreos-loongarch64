      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 1.12.1；纯 Go 静态编；scratch + CA；9100；采集宿主指标需挂 `/proc`、`/sys`、`/`'
  developer: Prometheus
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/prometheus.png
  tagline:
    zh_cn: Node Exporter 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Node Exporter LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Node Exporter
