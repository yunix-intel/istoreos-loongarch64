name: homeassistant
services:
  homeassistant:
    image: yunixintel/homeassistant:24.10-la5
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    environment:
      TZ: $TZ
    network_mode: host
    restart: unless-stopped
    container_name: homeassistant
x-casaos:
  architectures:
  - loong64
  main: homeassistant
  author: loong64-port
  category: Home Automation
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：建议 host 网络以发现设备。

      镜像说明：Core 2026.10.2；Python 3.14 自编；cryptography/grpcio/Pillow/aiohttp 等全源码编；cloud/camera 集成需运行期编译器，未预装'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: Host networking is recommended for device discovery.

      Image notes: Core 2026.10.2；Python 3.14 自编；cryptography/grpcio/Pillow/aiohttp 等全源码编；cloud/camera 集成需运行期编译器，未预装'
  developer: Home Assistant
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/home-assistant.png
  tagline:
    zh_cn: Home Assistant 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Home Assistant LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Home Assistant
    en_us: Home Assistant
  index: /
