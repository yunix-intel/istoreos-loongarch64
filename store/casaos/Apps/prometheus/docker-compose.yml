name: prometheus
services:
  prometheus:
    image: yunixintel/prometheus:24.10-la5
    container_name: prometheus
    ports:
    - target: 9090
      published: '18173'
      protocol: tcp
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/prometheus
      target: /prometheus
    restart: unless-stopped
    configs:
    - source: prometheus.yml
      target: /etc/prometheus/prometheus.yml
x-casaos:
  architectures:
  - loong64
  main: prometheus
  author: loong64-port
  category: Monitoring
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：prometheus.yml 以 compose configs 内嵌；自定义需修改 configs.content。

      镜像说明：3.15.0；UI 用 Vite 8 在 x86 WSL2 构建，Go `-tags builtinassets` 嵌入；TSDB `/prometheus`；9090'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: prometheus.yml is embedded via compose configs; edit configs.content to customize.

      Image notes: 3.15.0；UI 用 Vite 8 在 x86 WSL2 构建，Go `-tags builtinassets` 嵌入；TSDB `/prometheus`；9090'
  developer: Prometheus
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/prometheus.png
  tagline:
    zh_cn: Prometheus 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Prometheus LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Prometheus
    en_us: Prometheus
  index: /
  port_map: '18173'
configs:
  prometheus.yml:
    content: "global:\n  scrape_interval: 15s\nscrape_configs:\n  - job_name: prometheus\n    static_configs:\n      - targets:\
      \ [\"localhost:9090\"]\n"
