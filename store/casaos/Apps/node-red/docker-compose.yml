name: node-red
services:
  node-red:
    image: yunixintel/node-red:24.10-la5
    container_name: node-red
    ports:
    - target: 1880
      published: '18159'
      protocol: tcp
    environment:
      TZ: $TZ
      PORT: '1880'
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: node-red
  author: loong64-port
  category: Developer
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：5.0.8 + Node 24.22.1；基于 `yunixintel/node`；多阶段构建；1880；`/data`；保留 npm 支持 palette；UID 1001'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 5.0.8 + Node 24.22.1；基于 `yunixintel/node`；多阶段构建；1880；`/data`；保留 npm 支持 palette；UID 1001'
  developer: Node-RED
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/node-red.png
  tagline:
    zh_cn: Node-RED 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Node-RED LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Node-RED
    en_us: Node-RED
  index: /
  port_map: '18159'
