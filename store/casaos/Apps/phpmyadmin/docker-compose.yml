name: phpmyadmin
services:
  phpmyadmin:
    image: yunixintel/phpmyadmin:24.10-la5
    container_name: phpmyadmin
    ports:
    - target: 8080
      published: '18167'
      protocol: tcp
    environment:
      TZ: $TZ
      PMA_ARBITRARY: '1'
      UPLOAD_LIMIT: 64M
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: phpmyadmin
  author: loong64-port
  category: Utilities
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：5.2.3；PHP 8.3 + nginx/php-fpm；无需数据库即可开登录页；8080'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 5.2.3；PHP 8.3 + nginx/php-fpm；无需数据库即可开登录页；8080'
  developer: phpMyAdmin
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/phpmyadmin.png
  tagline:
    zh_cn: phpMyAdmin 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: phpMyAdmin LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: phpMyAdmin
    en_us: phpMyAdmin
  index: /
  port_map: '18167'
