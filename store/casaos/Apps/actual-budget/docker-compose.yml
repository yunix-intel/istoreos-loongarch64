name: actual-budget
services:
  actual-budget:
    image: yunixintel/actual-budget:24.10-la5
    ports:
    - target: 5006
      published: '18101'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    environment:
      TZ: $TZ
      ACTUAL_DATA_DIR: /data
      ACTUAL_PORT: '5006'
    restart: unless-stopped
    container_name: actual-budget
x-casaos:
  architectures:
  - loong64
  main: actual-budget
  author: loong64-port
  category: Productivity
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：26.10.0（@actual-app/sync-server）+ Node 24.22.1；`/opt/node24`；`/data`；5006；UID 1002；better-sqlite3 需手动 node-gyp
      编 loong64；无内置 TLS'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 26.10.0（@actual-app/sync-server）+ Node 24.22.1；`/opt/node24`；`/data`；5006；UID 1002；better-sqlite3 需手动 node-gyp
      编 loong64；无内置 TLS'
  developer: Actual Budget
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/actual-budget.png
  tagline:
    zh_cn: Actual Budget 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Actual Budget LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Actual Budget
    en_us: Actual Budget
  index: /
  port_map: '18101'
