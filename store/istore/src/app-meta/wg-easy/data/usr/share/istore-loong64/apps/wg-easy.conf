APP_ID='wg-easy'
APP_TITLE='wg-easy'
APP_IMAGE='yunixintel/wg-easy:24.10-la5'
APP_DEFAULT_VARIANT='public'
APP_VARIANTS='public|yunixintel/wg-easy:24.10-la5|https://github.com/yunix-intel/istoreos-loongarch64'
APP_PORTS='wireguard|51820|51820|udp|0
http|51821|51821|tcp|1'
APP_VOLUMES='wireguard|/srv/wg-easy/wireguard|/etc/wireguard|rw||1|dir|
modules|/lib/modules|/lib/modules|ro||0|dir|'
APP_ENV='INSECURE|true|0|
INIT_ENABLED|true|0|
INIT_USERNAME|admin|0|
INIT_PASSWORD|${SECRET:admin_password}|1|
INIT_HOST|${HOST_IP}|1|
INIT_PORT|51820|0|
DISABLE_IPV6|true|0|'
APP_SIDECARS=''
APP_SIDECAR_COMMAND=''
APP_SIDECAR_ENV=''
APP_SIDECAR_VOLUMES=''
APP_SIDECAR_PORTS=''
APP_DEVICES=''
APP_CAPS='NET_ADMIN
SYS_MODULE'
APP_GROUPS=''
APP_SYSCTLS='net.ipv4.ip_forward=1
net.ipv4.conf.all.src_valid_mark=1'
APP_HOST_NETWORK='0'
APP_DOCKER_SOCK='0'
APP_DOCKER_SOCK_RO='1'
APP_SHM=''
APP_USER=''
APP_COMMAND=''
APP_RESTART='unless-stopped'
APP_NETWORK_GROUP=''
APP_REQUIRES_APP=''
APP_HEALTH_PATH=''
APP_HEALTH_PORT=''
APP_MANUAL='把 INIT_HOST 改成公网/VPN 可达地址；真实隧道未验'
APP_REVIEW='需要 NET_ADMIN/SYS_MODULE 与 sysctls；51820/udp + 51821/tcp 固定端口。; 未在 OpenWrt/iStoreOS 真机上执行安装回归；仅做 ipk 结构与 JSON schema 静态校验。'
