APP_ID='linkwarden'
APP_TITLE='linkwarden'
APP_IMAGE='yunixintel/linkwarden:24.10-la5'
APP_DEFAULT_VARIANT='public'
APP_VARIANTS='public|yunixintel/linkwarden:24.10-la5|https://github.com/yunix-intel/istoreos-loongarch64
private|local/linkwarden-private:2.16.3-p1|https://github.com/yunix-intel/istore-la-private'
APP_PORTS='http|3000|18144|tcp|1'
APP_VOLUMES='data|/srv/linkwarden/data|/data/data|rw||1|dir|'
APP_ENV='DATABASE_URL|postgresql://linkwarden:${SECRET:pg_password}@linkwarden-pg:5432/linkwarden|1|
NEXTAUTH_URL|${PUBLIC_URL}/api/v1/auth|1|
NEXTAUTH_SECRET|${SECRET:nextauth_secret}|1|
STORAGE_FOLDER|data|1|
PLAYWRIGHT_WS_URL|http://linkwarden-lbrowser:9222|0|public'
APP_SIDECARS='linkwarden-pg|yunixintel/postgres:24.10-la5|||public,private|pg_isready -U linkwarden -d linkwarden|5s|3s|30|0
linkwarden-lbrowser|yunixintel/lbrowser-runtime:3.4.2293.2|1g||public||||5|0'
APP_SIDECAR_COMMAND='linkwarden-lbrowser^serve'
APP_SIDECAR_ENV='linkwarden-pg|POSTGRES_USER|linkwarden|1
linkwarden-pg|POSTGRES_PASSWORD|${SECRET:pg_password}|1
linkwarden-pg|POSTGRES_DB|linkwarden|1'
APP_SIDECAR_VOLUMES='linkwarden-pg|pgdata|/srv/linkwarden/pgdata|/var/lib/postgresql/data|rw|26:26
linkwarden-lbrowser|lbrowser|/opt/apps/lbrowser|/opt/apps/lbrowser|ro|'
APP_SIDECAR_PORTS=''
APP_DEVICES=''
APP_CAPS=''
APP_GROUPS=''
APP_SYSCTLS=''
APP_HOST_NETWORK='0'
APP_DOCKER_SOCK='0'
APP_DOCKER_SOCK_RO='1'
APP_SHM='1g'
APP_USER=''
APP_COMMAND=''
APP_RESTART='unless-stopped'
APP_NETWORK_GROUP=''
APP_REQUIRES_APP=''
APP_HEALTH_PATH=''
APP_HEALTH_PORT=''
APP_MANUAL=''
APP_REVIEW='PostgreSQL sidecar 必需；public 变体使用 LBrowser sidecar，private 变体内置浏览器；/data/data 持久化。; 安装器会先启动 sidecar：linkwarden-pg, linkwarden-lbrowser。; 未在 OpenWrt/iStoreOS 真机上执行安装回归；仅做 ipk 结构与 JSON schema 静态校验。'
