name: nocodb
services:
  nocodb:
    image: yunixintel/nocodb:24.10-la5
    container_name: nocodb
    ports:
    - target: 8080
      published: '18157'
      protocol: tcp
    environment:
      TZ: $TZ
      NC_DB: sqlite3://?d=/data/noco.db
      NC_TOOL_DIR: /data
      PORT: '8080'
      NODE_ENV: production
      NC_DISABLE_TELE: 'true'
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: nocodb
  author: loong64-port
  category: Developer
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：0.301.3 + Node 24.22.1；npm 需 --ignore-scripts 跳过 only-allow pnpm；sqlite3 手动 node-gyp 编 loong64；自定义 docker-main
      runner；`/data`；8080；UID 1000'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 0.301.3 + Node 24.22.1；npm 需 --ignore-scripts 跳过 only-allow pnpm；sqlite3 手动 node-gyp 编 loong64；自定义 docker-main
      runner；`/data`；8080；UID 1000'
  developer: NocoDB
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/nocodb.png
  tagline:
    zh_cn: NocoDB 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: NocoDB LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: NocoDB
    en_us: NocoDB
  index: /
  port_map: '18157'
