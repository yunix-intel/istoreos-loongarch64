APP_ID='miniflux'
APP_TITLE='Miniflux'
APP_IMAGE='yunixintel/miniflux:24.10-la5'
APP_DEFAULT_VARIANT='public'
APP_VARIANTS='public|yunixintel/miniflux:24.10-la5|https://github.com/yunix-intel/istoreos-loongarch64'
APP_PORTS=''
APP_VOLUMES=''
APP_ENV='DATABASE_URL|postgres://miniflux:${SECRET:pg_password}@miniflux-pg:5432/miniflux?sslmode=disable|1|
RUN_MIGRATIONS|1|1|
CREATE_ADMIN|1|1|
ADMIN_USERNAME|admin|1|
ADMIN_PASSWORD|${SECRET:admin_password}|1|'
APP_SIDECARS='miniflux-pg|yunixintel/postgres:24.10-la5|||public,private|pg_isready -U miniflux -d miniflux|5s|3s|30|0'
APP_SIDECAR_COMMAND=''
APP_SIDECAR_ENV='miniflux-pg|POSTGRES_USER|miniflux|1
miniflux-pg|POSTGRES_PASSWORD|${SECRET:pg_password}|1
miniflux-pg|POSTGRES_DB|miniflux|1'
APP_SIDECAR_VOLUMES='miniflux-pg|pgdata|/srv/miniflux/pgdata|/var/lib/postgresql/data|rw|26:26'
APP_SIDECAR_PORTS=''
APP_DEVICES=''
APP_CAPS=''
APP_GROUPS=''
APP_SYSCTLS=''
APP_HOST_NETWORK='0'
APP_DOCKER_SOCK='0'
APP_DOCKER_SOCK_RO='1'
APP_SHM=''
APP_USER=''
APP_COMMAND=''
APP_RESTART='unless-stopped'
APP_NETWORK_GROUP=''
APP_REQUIRES_APP=''
APP_HEALTH_PATH=''
APP_HEALTH_PORT=''
APP_MANUAL=''
APP_REVIEW='仅支持 PostgreSQL；安装器启动 sidecar 并执行迁移。管理员 admin，密码在 secrets 文件。; 安装器会先启动 sidecar：miniflux-pg。; 该应用没有对外 Web/服务端口（后台任务或需外部连接）。; 无 Dockerfile，端口/卷来自 docs/RUNBOOK.md 端口索引与人工核对。; 未在 OpenWrt/iStoreOS 真机上执行安装回归；仅做 ipk 结构与 JSON schema 静态校验。'
