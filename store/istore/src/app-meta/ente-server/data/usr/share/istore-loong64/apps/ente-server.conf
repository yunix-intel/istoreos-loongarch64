APP_ID='ente-server'
APP_TITLE='Ente Server'
APP_IMAGE='yunixintel/ente-server:24.10-la5'
APP_DEFAULT_VARIANT='public'
APP_VARIANTS='public|yunixintel/ente-server:24.10-la5|https://github.com/yunix-intel/istoreos-loongarch64'
APP_PORTS='http|8080|18120|tcp|1'
APP_VOLUMES='data|/srv/ente-server/data|/data|rw||1|dir|'
APP_ENV='ENTE_DB_HOST|ente-pg|1|
ENTE_DB_NAME|ente_db|1|
ENTE_DB_USER|pguser|1|
ENTE_DB_PASSWORD|${SECRET:pg_password}|1|
ENTE_S3_ENDPOINT|ente-minio:9000|1|
ENTE_S3_KEY|istoreadmin|1|
ENTE_S3_SECRET|${SECRET:minio_password}|1|'
APP_SIDECARS='ente-pg|yunixintel/postgres:24.10-la5|||public,private|pg_isready -U pguser -d ente_db|5s|3s|30|0
ente-minio|yunixintel/minio:24.10-la5|||public,private||||15|0'
APP_SIDECAR_COMMAND=''
APP_SIDECAR_ENV='ente-pg|POSTGRES_USER|pguser|1
ente-pg|POSTGRES_PASSWORD|${SECRET:pg_password}|1
ente-pg|POSTGRES_DB|ente_db|1
ente-minio|MINIO_ROOT_USER|istoreadmin|1
ente-minio|MINIO_ROOT_PASSWORD|${SECRET:minio_password}|1'
APP_SIDECAR_VOLUMES='ente-pg|pgdata|/srv/ente/pgdata|/var/lib/postgresql/data|rw|26:26
ente-minio|miniodata|/srv/ente/miniodata|/data|rw|1000:1000'
APP_SIDECAR_PORTS=''
APP_DEVICES=''
APP_CAPS=''
APP_GROUPS=''
APP_SYSCTLS=''
APP_HOST_NETWORK='0'
APP_DOCKER_SOCK='0'
APP_DOCKER_SOCK_RO='1'
APP_SHM=''
APP_USER=''
APP_COMMAND=''
APP_RESTART='unless-stopped'
APP_NETWORK_GROUP='ente'
APP_REQUIRES_APP=''
APP_HEALTH_PATH=''
APP_HEALTH_PORT=''
APP_MANUAL='minio 启动后需用 mc 创建 b2-eu-cen 等 bucket'
APP_REVIEW='PostgreSQL + MinIO sidecar；/data 必须持久化，museum.yaml 丢失后旧数据无法解密。; 安装器会先启动 sidecar：ente-pg, ente-minio。; 未在 OpenWrt/iStoreOS 真机上执行安装回归；仅做 ipk 结构与 JSON schema 静态校验。'
