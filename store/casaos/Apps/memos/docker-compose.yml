name: memos
services:
  memos:
    image: yunixintel/memos:loong64
    container_name: memos
    ports:
    - target: 5230
      published: '18009'
      protocol: tcp
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /var/opt/memos
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: memos
  author: loong64-port
  category: Productivity
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v0.31.0 源码编（官方无 loong64）；纯 Go sqlite；前端在 x64 上编（rolldown 无 loong64 binding），产物架构无关'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v0.31.0 源码编（官方无 loong64）；纯 Go sqlite；前端在 x64 上编（rolldown 无 loong64 binding），产物架构无关'
  developer: usememos
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/memos.png
  tagline:
    zh_cn: Memos 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Memos LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Memos
    en_us: Memos
  index: /
  port_map: '18009'
