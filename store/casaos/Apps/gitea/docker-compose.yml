name: gitea
services:
  gitea:
    image: yunixintel/gitea:24.10-la5
    ports:
    - target: 3000
      published: '18125'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /etc/gitea
    environment:
      TZ: $TZ
      USER_UID: '1000'
      USER_GID: '1000'
    restart: unless-stopped
    container_name: gitea
x-casaos:
  architectures:
  - loong64
  main: gitea
  author: loong64-port
  category: Developer
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v28.2.0；Go 1.27 自编；modernc SQLite；入口脚本生成 app.ini；3000'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v28.2.0；Go 1.27 自编；modernc SQLite；入口脚本生成 app.ini；3000'
  developer: Gitea
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/gitea.png
  tagline:
    zh_cn: Gitea 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Gitea LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Gitea
    en_us: Gitea
  index: /
  port_map: '18125'
