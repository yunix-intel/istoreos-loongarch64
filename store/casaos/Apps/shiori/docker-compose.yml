name: shiori
services:
  shiori:
    image: yunixintel/shiori:24.10-la5
    container_name: shiori
    ports:
    - target: 8080
      published: '18183'
      protocol: tcp
    environment:
      TZ: $TZ
      SHIORI_DIR: /data
      SHIORI_HTTP_SECRET_KEY: change-me
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: shiori
  author: loong64-port
  category: Productivity
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v1.8.0；Go 静态编；8080 端口；生产建议设 `SHIORI_HTTP_SECRET_KEY`'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v1.8.0；Go 静态编；8080 端口；生产建议设 `SHIORI_HTTP_SECRET_KEY`'
  developer: Shiori
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/shiori.png
  tagline:
    zh_cn: Shiori 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Shiori LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Shiori
    en_us: Shiori
  index: /
  port_map: '18183'
