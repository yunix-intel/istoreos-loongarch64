services:
  postgres:
    image: yunixintel/postgres:loong64
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: linkwarden
    volumes:
      - pgdata:/var/lib/postgresql/data

  linkwarden:
    # private-only single image: LBrowser is baked in, no sidecar/host mount.
    image: local/linkwarden-private:2.16.3-p1
    depends_on: [postgres]
    ports: ["3000:3000"]
    shm_size: "1g"
    environment:
      DATABASE_URL: postgresql://linkwarden:change-me@postgres:5432/linkwarden
      NEXTAUTH_URL: http://<host>:3000/api/v1/auth
      NEXTAUTH_SECRET: <openssl rand -base64 32>
      STORAGE_FOLDER: data
    volumes:
      - ./data:/data/data

volumes:
  pgdata: {}
