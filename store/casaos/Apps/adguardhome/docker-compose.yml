name: adguardhome
services:
  adguardhome:
    image: yunixintel/adguardhome:loong64
    container_name: adguardhome
    ports:
    - target: 3000
      published: '18006'
      protocol: tcp
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: 全网广告与跟踪器拦截 DNS 服务器。
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: adguardhome
  author: loong64-port
  category: Networking
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：官方无 loong64 资产，源码自编 + 官方前端。

      缺失功能：53 端口需避让宿主 dnsmasq。

      额外依赖：建议 host 网络；3000 Web；持久化 work/conf。

      镜像说明：官方无 loong64 资产，源码自编 + 官方前端；53 端口需映射避让宿主 dnsmasq'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: No official loong64 asset; built from source with the official frontend.

      Missing features: Port 53 conflicts with the host dnsmasq.

      Extra dependencies: Host networking recommended; web on 3000; persist work/conf.

      Image notes: 官方无 loong64 资产，源码自编 + 官方前端；53 端口需映射避让宿主 dnsmasq'
  developer: Home
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/adguardhome/icon.png
  tagline:
    zh_cn: AdGuard Home 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: AdGuard Home LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: AdGuard Home
    en_us: AdGuard Home
  index: /
  port_map: '18006'
