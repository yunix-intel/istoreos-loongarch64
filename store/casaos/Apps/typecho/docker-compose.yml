name: typecho
services:
  typecho:
    image: yunixintel/typecho:24.10-la5
    container_name: typecho
    ports:
    - target: 80
      published: '18188'
      protocol: tcp
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/usr
      target: /var/www/html/usr
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: typecho
  author: loong64-port
  category: Productivity
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v1.3.0；PHP 8.3 + nginx/php-fpm；**config.inc.php 与 typecho.db 在站点根目录**（不在挂载卷内，重建容器前需一并备份）'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v1.3.0；PHP 8.3 + nginx/php-fpm；**config.inc.php 与 typecho.db 在站点根目录**（不在挂载卷内，重建容器前需一并备份）'
  developer: Typecho
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/wordpress.png
  tagline:
    zh_cn: Typecho 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Typecho LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Typecho
    en_us: Typecho
  index: /
  port_map: '18188'
