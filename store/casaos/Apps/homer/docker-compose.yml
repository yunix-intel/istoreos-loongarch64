name: homer
services:
  homer:
    image: yunixintel/homer:24.10-la5
    container_name: homer
    ports:
    - target: 8080
      published: '18135'
      protocol: tcp
    environment:
      TZ: $TZ
    restart: unless-stopped
    configs:
    - source: homer-config.yml
      target: /usr/share/nginx/html/assets/config.yml
x-casaos:
  architectures:
  - loong64
  main: homer
  author: loong64-port
  category: Networking
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：config.yml 以 compose configs 内嵌；自定义需修改 configs.content。

      镜像说明：v26.08.3；openEuler nginx 1.24 + 官方静态包；8080'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: config.yml is embedded via compose configs; edit configs.content to customize.

      Image notes: v26.08.3；openEuler nginx 1.24 + 官方静态包；8080'
  developer: Bastien Wirtz
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/homer.png
  tagline:
    zh_cn: homer 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: homer LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: homer
    en_us: homer
  index: /
  port_map: '18135'
configs:
  homer-config.yml:
    content: 'title: "Homer"

      subtitle: "LoongArch64"

      header: true

      footer: false

      columns: "3"

      services: []

      '
