name: joplin-server
services:
  joplin-server:
    image: yunixintel/joplin-server:24.10-la5
    container_name: joplin-server
    ports:
    - target: 22300
      published: '18139'
      protocol: tcp
    environment:
      TZ: $TZ
      APP_BASE_URL: http://localhost:18139
      APP_PORT: '22300'
      DB_CLIENT: pg
      POSTGRES_HOST: joplin-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplinpass
      DEFAULT_ADMIN_PASSWORD: change-me
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    depends_on:
      joplin-postgres:
        condition: service_healthy
    restart: unless-stopped
  joplin-postgres:
    image: yunixintel/postgres:loong64
    container_name: joplin-postgres
    environment:
      TZ: $TZ
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplinpass
      POSTGRES_DB: joplin
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/postgres
      target: /var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
x-casaos:
  architectures:
  - loong64
  main: joplin-server
  author: loong64-port
  category: Utilities
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：全程 loongarch64 构建；sqlite3 5.1.6 源码编译；Rollup 使用 wasm 别名。

      缺失功能：无 sharp/sqlite-vec/PM2；向量搜索禁用；未验证桌面客户端双端同步、LDAP/SAML/Stripe/邮件。

      额外依赖：需 PostgreSQL；/data 持久化（含临时 SQLite）；22300；UID 1119；APP_BASE_URL 必填。

      镜像说明：3.7.21；Node 24 + PostgreSQL；sqlite3 5.1.6 源码编（临时库）；Rollup 用 wasm 别名；`/data`；22300；UID 1119；无 sharp/sqlite-vec/PM2'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: Built natively on loongarch64; sqlite3 5.1.6 is compiled from source; Rollup uses the wasm alias.

      Missing features: No sharp/sqlite-vec/PM2; vector search is disabled; desktop sync, LDAP/SAML/Stripe and email are unverified.

      Extra dependencies: Requires PostgreSQL; persist /data (including the temporary SQLite); port 22300; UID 1119; APP_BASE_URL
      is required.

      Image notes: 3.7.21；Node 24 + PostgreSQL；sqlite3 5.1.6 源码编（临时库）；Rollup 用 wasm 别名；`/data`；22300；UID 1119；无 sharp/sqlite-vec/PM2'
  developer: Joplin
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/joplin.png
  tagline:
    zh_cn: joplin-server 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: joplin-server LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: joplin-server
    en_us: joplin-server
  index: /
  port_map: '18139'
