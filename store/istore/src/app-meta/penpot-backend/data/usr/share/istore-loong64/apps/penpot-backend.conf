APP_ID='penpot-backend'
APP_TITLE='Penpot (backend)'
APP_IMAGE='yunixintel/penpot-backend:24.10-la5'
APP_DEFAULT_VARIANT='public'
APP_VARIANTS='public|yunixintel/penpot-backend:24.10-la5|https://github.com/yunix-intel/istoreos-loongarch64'
APP_PORTS=''
APP_VOLUMES='assets|/srv/penpot-backend/assets|/opt/data/assets|rw||1|dir|'
APP_ENV='PENPOT_PUBLIC_URI|http://${HOST_IP}:9001|1|
PENPOT_SECRET_KEY|${SECRET:penpot_secret}|1|
PENPOT_DATABASE_URI|postgresql://penpot-postgres/penpot|1|
PENPOT_DATABASE_USERNAME|penpot|1|
PENPOT_DATABASE_PASSWORD|${SECRET:pg_password}|1|
PENPOT_REDIS_URI|redis://penpot-redis:6379/0|1|
PENPOT_FLAGS|disable-email-verification disable-secure-session-cookies|0|'
APP_SIDECARS='penpot-postgres|yunixintel/postgres:24.10-la5|||public,private|pg_isready -U penpot -d penpot|5s|3s|30|0
penpot-redis|yunixintel/redis:24.10-la5|||public,private|redis-cli -a "$REDIS_PASSWORD" ping|5s|3s|20|0'
APP_SIDECAR_COMMAND=''
APP_SIDECAR_ENV='penpot-postgres|POSTGRES_USER|penpot|1
penpot-postgres|POSTGRES_PASSWORD|${SECRET:pg_password}|1
penpot-postgres|POSTGRES_DB|penpot|1
penpot-redis|REDIS_PASSWORD|${SECRET:redis_password}|1'
APP_SIDECAR_VOLUMES='penpot-postgres|pgdata|/srv/penpot/pgdata|/var/lib/postgresql/data|rw|26:26
penpot-redis|redisdata|/srv/penpot/redisdata|/data|rw|998:996'
APP_SIDECAR_PORTS=''
APP_DEVICES=''
APP_CAPS=''
APP_GROUPS=''
APP_SYSCTLS=''
APP_HOST_NETWORK='0'
APP_DOCKER_SOCK='0'
APP_DOCKER_SOCK_RO='1'
APP_SHM=''
APP_USER=''
APP_COMMAND=''
APP_RESTART='unless-stopped'
APP_NETWORK_GROUP='penpot'
APP_REQUIRES_APP=''
APP_HEALTH_PATH=''
APP_HEALTH_PORT=''
APP_MANUAL=''
APP_REVIEW='后端只在 istore-penpot 网络内监听 6060，不发布宿主端口；对外入口是 penpot-frontend:9001。; 需要 PostgreSQL + Redis；sidecar 与 penpot-frontend 共用 istore-penpot 网络。; 安装器会先启动 sidecar：penpot-postgres, penpot-redis。; 该应用没有对外 Web/服务端口（后台任务或需外部连接）。; 未在 OpenWrt/iStoreOS 真机上执行安装回归；仅做 ipk 结构与 JSON schema 静态校验。'
