name: qbittorrent-ee
services:
  qbittorrent-ee:
    image: yunixintel/qbittorrent-ee:loong64
    container_name: qbittorrent-ee
    ports:
    - target: 8080
      published: '18014'
      protocol: tcp
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: qbittorrent-ee
  author: loong64-port
  category: Downloaders
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：官方 loong64 静态包；WebUI 校验 Host header。

      缺失功能：端口映射与 WebUI 端口不一致时会拒绝访问。

      额外依赖：建议让 WebUI 端口与宿主映射端口一致。

      镜像说明：v5.2.4.10 官方 loong64 静态包；Host header 校验会拒绝端口映射不一致的访问，建议 `--webui-port` 与映射端口一致'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: Official loong64 static package; the WebUI validates the Host header.

      Missing features: Requests are rejected when the mapped port differs from the WebUI port.

      Extra dependencies: Keep the WebUI port equal to the published host port.

      Image notes: v5.2.4.10 官方 loong64 静态包；Host header 校验会拒绝端口映射不一致的访问，建议 `--webui-port` 与映射端口一致'
  developer: qBittorrent
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/qbittorrent.png
  tagline:
    zh_cn: qBittorrent (Enhanced Edition) 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: qBittorrent (Enhanced Edition) LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: qBittorrent (Enhanced Edition)
    en_us: qBittorrent (Enhanced Edition)
  index: /
  port_map: '18014'
