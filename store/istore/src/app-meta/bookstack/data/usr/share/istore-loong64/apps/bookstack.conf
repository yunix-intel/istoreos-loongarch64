APP_PORTS='http|80|18109|tcp|1'
APP_VOLUMES='storage|/srv/bookstack/storage|/var/www/bookstack/storage|rw||1|dir|
uploads|/srv/bookstack/uploads|/var/www/bookstack/public/uploads|rw||0|dir|'
APP_ENV='APP_URL|${PUBLIC_URL}|1|
DB_HOST|bookstack-db|1|
DB_DATABASE|bookstack|1|
