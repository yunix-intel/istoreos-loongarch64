name: jellyseerr
services:
  jellyseerr:
    image: yunixintel/jellyseerr:24.10-la5
    container_name: jellyseerr
    ports:
    - target: 5055
      published: '18137'
      protocol: tcp
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /app/config
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: jellyseerr
  author: loong64-port
  category: Media
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：Next 16 使用 WASM SWC 在 x86 构建；sharp 不可用，图片优化关闭。

      缺失功能：无 Next 图片优化器；依赖上游请求服务。

      额外依赖：需 Sonarr/Radarr 等上游服务；5055。

      镜像说明：v3.5.0；Next 16 用 WASM SWC（无 loong64 binding）；sharp 不可用 → `images.unoptimized`；5055 端口'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: Next 16 is built on x86 with WASM SWC; sharp is unavailable, so image optimization is disabled.

      Missing features: No Next image optimizer; relies on upstream request services.

      Extra dependencies: Requires Sonarr/Radarr and other upstream services; port 5055.

      Image notes: v3.5.0；Next 16 用 WASM SWC（无 loong64 binding）；sharp 不可用 → `images.unoptimized`；5055 端口'
  developer: Jellyseerr
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/jellyseerr.png
  tagline:
    zh_cn: Jellyseerr 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Jellyseerr LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Jellyseerr
    en_us: Jellyseerr
  index: /
  port_map: '18137'
