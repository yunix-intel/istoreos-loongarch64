name: dashy
services:
  dashy:
    image: yunixintel/dashy:24.10-la5
    ports:
    - target: 8080
      published: '18115'
      protocol: tcp
    environment:
      TZ: $TZ
    restart: unless-stopped
    container_name: dashy
    configs:
    - source: dashy-conf.yml
      target: /usr/share/nginx/html/conf.yml
x-casaos:
  architectures:
  - loong64
  main: dashy
  author: loong64-port
  category: Networking
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：conf.yml 以 compose configs 内嵌；自定义需修改 configs.content。

      镜像说明：4.8.0；官方预构建 `dist/` + nginx 1.24；配置挂载 `/usr/share/nginx/html/conf.yml`；8080'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: conf.yml is embedded via compose configs; edit configs.content to customize.

      Image notes: 4.8.0；官方预构建 `dist/` + nginx 1.24；配置挂载 `/usr/share/nginx/html/conf.yml`；8080'
  developer: Dashy
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/dashy.png
  tagline:
    zh_cn: Dashy 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Dashy LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Dashy
    en_us: Dashy
  index: /
  port_map: '18115'
configs:
  dashy-conf.yml:
    content: "pageInfo:\n  title: Dashy\n  description: LoongArch64 dashboard\nappConfig:\n  theme: dark\nsections: []\n"
