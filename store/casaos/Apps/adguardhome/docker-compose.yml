name: adguardhome
services:
  adguardhome:
    image: yunixintel/adguardhome:loong64
    container_name: adguardhome
    ports:
    - target: 3000
      published: '18006'
      protocol: tcp
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: 全网广告与跟踪器拦截 DNS 服务器。
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: adguardhome
  author: loong64-port
  category: Networking
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：需 host 网络并避让宿主 dnsmasq。

      镜像说明：官方无 loong64 资产，源码自编 + 官方前端；53 端口需映射避让宿主 dnsmasq'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: Requires host networking; avoid the host dnsmasq on port 53.

      Image notes: 官方无 loong64 资产，源码自编 + 官方前端；53 端口需映射避让宿主 dnsmasq'
  developer: Home
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/adguardhome/icon.png
  tagline:
    zh_cn: AdGuard Home 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: AdGuard Home LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: AdGuard Home
    en_us: AdGuard Home
  index: /
  port_map: '18006'
