name: mariadb
services:
  mariadb:
    image: yunixintel/mariadb:24.10-la5
    container_name: mariadb
    ports:
    - target: 3306
      published: '18145'
      protocol: tcp
    environment:
      TZ: $TZ
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: change-me-app
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /var/lib/mysql
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: mariadb
  author: loong64-port
  category: Utilities
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：10.11.18（openEuler 包）；`MYSQL_ROOT_PASSWORD/DATABASE/USER/PASSWORD/ALLOW_EMPTY_PASSWORD`；`/var/lib/mysql`；3306；root
      仅 localhost；日志走 stderr；UID/GID 27'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 10.11.18（openEuler 包）；`MYSQL_ROOT_PASSWORD/DATABASE/USER/PASSWORD/ALLOW_EMPTY_PASSWORD`；`/var/lib/mysql`；3306；root
      仅 localhost；日志走 stderr；UID/GID 27'
  developer: MariaDB Foundation
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/mariadb.png
  tagline:
    zh_cn: MariaDB 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: MariaDB LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: MariaDB
    en_us: MariaDB
  index: /
  port_map: '18145'
