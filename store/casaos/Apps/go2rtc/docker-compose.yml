name: go2rtc
services:
  go2rtc:
    image: yunixintel/go2rtc:24.10-la5
    ports:
    - target: 1984
      published: '18126'
      protocol: tcp
    - target: 8554
      published: '19111'
      protocol: tcp
    - target: 8555
      published: '19112'
      protocol: tcp
    - target: 8555
      published: '19112'
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    environment:
      TZ: $TZ
    restart: unless-stopped
    container_name: go2rtc
x-casaos:
  architectures:
  - loong64
  main: go2rtc
  author: loong64-port
  category: Media
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：单二进制，无 ffmpeg 依赖。

      缺失功能：默认无摄像头流配置、无认证。

      额外依赖：1984 API、8554 RTSP、8555 WebRTC；跨 NAT 需配置 candidates。

      镜像说明：1.9.14；Go 单二进制；1984 API、8554 RTSP、8555 WebRTC；`/config`；UID 1109；默认无认证、无摄像头配置'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: Single binary; no ffmpeg dependency.

      Missing features: No default camera streams and no authentication.

      Extra dependencies: Ports 1984 API, 8554 RTSP, 8555 WebRTC; configure candidates behind NAT.

      Image notes: 1.9.14；Go 单二进制；1984 API、8554 RTSP、8555 WebRTC；`/config`；UID 1109；默认无认证、无摄像头配置'
  developer: AlexxIT
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/go2rtc.png
  tagline:
    zh_cn: go2rtc 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: go2rtc LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: go2rtc
    en_us: go2rtc
  index: /
  port_map: '18126'
