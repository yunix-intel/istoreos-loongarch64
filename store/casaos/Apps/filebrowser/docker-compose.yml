name: filebrowser
services:
  filebrowser:
    image: yunixintel/filebrowser:loong64
    container_name: filebrowser
    ports:
    - target: 8080
      published: '18018'
      protocol: tcp
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/database
      target: /database
    - type: bind
      source: /DATA
      target: /srv
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: filebrowser
  author: loong64-port
  category: Cloud
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：上游已于 2026-09-01 归档，无后续安全修复；镜像默认监听 0.0.0.0（v2.63 上游默认 127.0.0.1）。

      缺失功能：无上游安全更新。

      额外依赖：8080；持久化 /srv 与数据库。

      镜像说明：v2.63.23 源码编；**上游 2026-09-01 已归档**，无后续安全修复；默认监听改 0.0.0.0（v2.63 默认 127.0.0.1）'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: Upstream was archived on 2026-09-01 with no further security fixes; the image listens on 0.0.0.0 (v2.63
      upstream defaults to 127.0.0.1).

      Missing features: No upstream security updates.

      Extra dependencies: Port 8080; persist /srv and the database.

      Image notes: v2.63.23 源码编；**上游 2026-09-01 已归档**，无后续安全修复；默认监听改 0.0.0.0（v2.63 默认 127.0.0.1）'
  developer: FileBrowser
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/file-browser.png
  tagline:
    zh_cn: File Browser 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: File Browser LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: File Browser
    en_us: File Browser
  index: /
  port_map: '18018'
