name: kodexplorer
services:
  kodexplorer:
    image: yunixintel/kodexplorer:24.10-la5
    container_name: kodexplorer
    ports:
    - target: 80
      published: '18141'
      protocol: tcp
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /var/www/html/data
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: kodexplorer
  author: loong64-port
  category: Cloud
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：4.55；PHP 8.3 + nginx/php-fpm；首启为环境检查/设置管理员；默认 admin/admin'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 4.55；PHP 8.3 + nginx/php-fpm；首启为环境检查/设置管理员；默认 admin/admin'
  developer: KodExplorer
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/filebrowser-quantum.png
  tagline:
    zh_cn: KodExplorer 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: KodExplorer LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: KodExplorer
    en_us: KodExplorer
  index: /
  port_map: '18141'
