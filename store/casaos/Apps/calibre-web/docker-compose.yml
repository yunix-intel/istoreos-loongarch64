name: calibre-web
services:
  calibre-web:
    image: yunixintel/calibre-web:24.10-la5
    ports:
    - target: 8083
      published: '18111'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/books
      target: /books
    environment:
      TZ: $TZ
    restart: unless-stopped
    container_name: calibre-web
x-casaos:
  architectures:
  - loong64
  main: calibre-web
  author: loong64-port
  category: Media
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：0.6.27；Python 3.11 + Rust 源码编 lxml/nh3/cryptography；8083 端口；书库挂 /books'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 0.6.27；Python 3.11 + Rust 源码编 lxml/nh3/cryptography；8083 端口；书库挂 /books'
  developer: Calibre-Web
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/calibre-web.png
  tagline:
    zh_cn: Calibre-Web 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Calibre-Web LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Calibre-Web
    en_us: Calibre-Web
  index: /
  port_map: '18111'
