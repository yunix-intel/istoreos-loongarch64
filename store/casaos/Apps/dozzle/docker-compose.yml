name: dozzle
services:
  dozzle:
    image: yunixintel/dozzle:24.10-la5
    ports:
    - target: 8080
      published: '18116'
      protocol: tcp
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true
    environment:
      TZ: $TZ
    restart: unless-stopped
    container_name: dozzle
x-casaos:
  architectures:
  - loong64
  main: dozzle
  author: loong64-port
  category: Developer
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：需挂载 docker.sock。

      镜像说明：前端 Bun 1.4.3/Vite 在 x86 WSL2 构建（产物架构无关），Go 1.27.2 在 A 编 loong64；scratch；需挂 docker.sock；8080'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: Requires docker.sock.

      Image notes: 前端 Bun 1.4.3/Vite 在 x86 WSL2 构建（产物架构无关），Go 1.27.2 在 A 编 loong64；scratch；需挂 docker.sock；8080'
  developer: Dozzle
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/dozzle.png
  tagline:
    zh_cn: Dozzle 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Dozzle LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Dozzle
    en_us: Dozzle
  index: /
  port_map: '18116'
