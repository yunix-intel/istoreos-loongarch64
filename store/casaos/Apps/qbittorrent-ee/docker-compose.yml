name: qbittorrent-ee
services:
  qbittorrent-ee:
    image: yunixintel/qbittorrent-ee:loong64
    container_name: qbittorrent-ee
    ports:
    - target: 8080
      published: '18014'
      protocol: tcp
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: qbittorrent-ee
  author: loong64-port
  category: Downloaders
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：v5.2.4.10 官方 loong64 静态包；Host header 校验会拒绝端口映射不一致的访问，建议 `--webui-port` 与映射端口一致'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: v5.2.4.10 官方 loong64 静态包；Host header 校验会拒绝端口映射不一致的访问，建议 `--webui-port` 与映射端口一致'
  developer: qBittorrent
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/qbittorrent-ee/icon.png
  tagline:
    zh_cn: qBittorrent (Enhanced Edition) 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: qBittorrent (Enhanced Edition) LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: qBittorrent (Enhanced Edition)
    en_us: qBittorrent (Enhanced Edition)
  index: /
  port_map: '18014'
