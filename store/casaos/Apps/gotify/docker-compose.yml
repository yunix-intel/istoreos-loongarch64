name: gotify
services:
  gotify:
    image: yunixintel/gotify:24.10-la5
    ports:
    - target: 8080
      published: '18127'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    environment:
      TZ: $TZ
      GOTIFY_SERVER_PORT: '8080'
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: /data/gotify.db
    restart: unless-stopped
    container_name: gotify
x-casaos:
  architectures:
  - loong64
  main: gotify
  author: loong64-port
  category: Utilities
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：无额外外部依赖（镜像说明中另有注明的除外）。

      镜像说明：3.1.1；Go CGO（go-sqlite3）在 openEuler 容器编；UI Vite 8 在 x86 WSL2 构建；8080；数据卷 `/data`'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: No extra external dependency unless the image notes say otherwise.

      Image notes: 3.1.1；Go CGO（go-sqlite3）在 openEuler 容器编；UI Vite 8 在 x86 WSL2 构建；8080；数据卷 `/data`'
  developer: Gotify
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/gotify.png
  tagline:
    zh_cn: Gotify 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Gotify LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Gotify
    en_us: Gotify
  index: /
  port_map: '18127'
