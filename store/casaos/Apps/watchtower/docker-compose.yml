name: watchtower
services:
  watchtower:
    image: yunixintel/watchtower:24.10-la5
    container_name: watchtower
    environment:
      TZ: $TZ
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    command:
    - --label-enable
    - --interval
    - '3600'
    restart: unless-stopped
x-casaos:
  architectures:
  - loong64
  main: watchtower
  author: loong64-port
  category: Utilities
  description:
    zh_cn: '**龙芯版说明**


      架构：linux/loong64（仅龙芯 3A5000/3A6000，x86/ARM 无法运行）

      龙芯版说明：此镜像为 LoongArch 适配构建；上游主要功能保留，但尚未逐项做行为回归，镜像说明中列出的限制同样适用。

      缺失功能：未逐项验证上游全部功能；请以镜像说明中的限制为准。

      额外依赖：需挂载 docker.sock。

      镜像说明：v1.7.1；Go 静态二进制 + CA 证书；需挂 `/var/run/docker.sock`；`--label-enable` 只更新带标签容器'
    en_us: '**LoongArch notes**


      Architecture: linux/loong64 only (Loongson 3A5000/3A6000; x86/ARM images will not run)

      LoongArch notes: LoongArch build; upstream functionality is largely retained, but behavior was not regression-tested
      item by item. Limitations in the image notes also apply.

      Missing features: Upstream features were not verified item by item; treat the image notes as the limitation list.

      Extra dependencies: Requires docker.sock.

      Image notes: v1.7.1；Go 静态二进制 + CA 证书；需挂 `/var/run/docker.sock`；`--label-enable` 只更新带标签容器'
  developer: Containrrr
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/watchtower.png
  tagline:
    zh_cn: Watchtower 的 LoongArch64 镜像，详见龙芯版说明。
    en_us: Watchtower LoongArch64 image; see the LoongArch notes.
  title:
    zh_cn: Watchtower
    en_us: Watchtower
  index: /
